user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip settings optimizadas para alto rendimiento y compresión JS/CSS
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # Detectar SSL detrás de proxy reverso (Dokploy / Traefik)
    map $http_x_forwarded_proto $fastcgi_https {
        default $https;
        https on;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;
        root /var/www/html/public;
        index index.php index.html;

        client_max_body_size 100M;
        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_param HTTP_HOST $http_host;
            fastcgi_param HTTPS $fastcgi_https;
            fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            fastcgi_read_timeout 300;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;
            fastcgi_busy_buffers_size 256k;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }

        # 1. Chunks de Webpack con hash único en el nombre (inmutables, caché de 1 año)
        location ~* ^/js/chunks/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # 2. app.js principal: NUNCA retener en caché fija para sincronizar despliegues de inmediato
        location = /js/app.js {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files $uri =404;
        }

        # 3. Video institucional y multimedia (MP4, WebM, OGG) con soporte nativo de rangos HTTP 206
        location ~* \.(mp4|webm|ogg)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            try_files $uri =404;
        }

        # 4. Archivos estáticos generales (imágenes, fuentes, favicons, hojas de estilo)
        location ~* \.(jpg|jpeg|gif|png|css|ico|xml|woff|woff2|ttf|eot|svg)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
            try_files $uri =404;
        }
    }
}
