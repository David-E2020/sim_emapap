services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sim_emapap_app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      APP_NAME: "SIM-EMAPA"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: "base64:i2EfcWehqe7JhdoF8EegvNMtV9id4Ufel3NORSvDcY0="
      JWT_SECRET: "lghRdpyeG4oO4jE7RAPeYuMdfE4TZI2jRhsc0xo64FXUvxItIXLvt4mgg5O4HGSt"
      APP_URL: "http://localhost:8080"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: sim_emapap
      DB_USERNAME: postgres
      DB_PASSWORD: secretpassword
      RUN_MIGRATIONS: "true"
      RUN_SEEDERS: "true"
    volumes:
      - app_storage:/var/www/html/storage/app/public
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    container_name: sim_emapap_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sim_emapap
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sim_emapap"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  app_storage:
  pgdata:

